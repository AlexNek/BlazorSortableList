assembly-informational-format: '{Major}.{Minor}.{Patch}.{CommitsSinceVersionSource}'
next-version: 2.1.2

branches:
  master:
    regex: ^master$
    increment: Patch
    label: ''

  develop:
    regex: ^develop$
    increment: Inherit
    label: alpha

ignore:
  sha: []

merge-message-formats: {}
